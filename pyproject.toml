[project]
name = "mandi"
version = "0.1.0"
description = "Mandi: cross-company AI procurement negotiation on Switch rooms. Agents negotiate. Humans decide. Switch enforces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Naman Chordia" }, { name = "Divya" }]
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "sqlmodel==0.0.48",
  "pydantic==2.14.3",
  "httpx==0.28.1",
  "websockets==17.4",
  "openai==3.46.0",
  "pdfplumber==0.11.10",
  "pymupdf==2.1",
  "reportlab==5.1.0",
  "pyyaml==6.0.3",
  "python-dotenv==1.2.4",
  "mcp==2.3.0",
  "sse-starlette==3.6.0",
  "python-multipart==0.0.33",
  "qrcode==8.2",
  "pillow==13.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "agents/switchclient/tests", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs a running Switch server (skipped by default; run with -m live)"]
addopts = "-m 'not live' -q"

[tool.setuptools]
packages = []
